[Settings]
; Nível de saturação padrão da área de trabalho do Windows (0 a 100, padrão 50%)
WindowsVibrance=50

; Nível de saturação quando o CS2 estiver em foco (0 a 100, recomendado 100%)
CS2Vibrance=100

; Nitidez adicional (0 = desligada, 1 a 100 = nível de nitidez desejado)
SharpnessPercent=0

; Ativar mesmo se o jogo estiver em modo janela / janela sem bordas (1 = sim, 0 = somente tela cheia)
ApplyInWindowed=1

; Intervalo de verificação de foco em milissegundos (padrão 500 ms = 0.5s para 0% de uso de CPU)
PollingIntervalMs=500

; Nome do processo monitorado (minúsculo)
TargetProcess=cs2.exe
